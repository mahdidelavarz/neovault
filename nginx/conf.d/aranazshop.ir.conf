server {
    listen 80;
    server_name aranazshop.ir www.aranazshop.ir;
    return 301 https://aranazshop.ir$request_uri;
}

server {
    listen 443 ssl;
    server_name aranazshop.ir;

    ssl_certificate /etc/nginx/ssl/aranazshop/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/aranazshop/private.key;

    client_max_body_size 10m;

    location /api/v1/ {
        proxy_pass http://aranazshop-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://aranazshop-backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://aranazshop-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}