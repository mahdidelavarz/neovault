server {
    listen 80;
    server_name mahdidelavar.ir www.mahdidelavar.ir;
    return 301 https://mahdidelavar.ir$request_uri;
}

server {
    listen 443 ssl;
    server_name www.mahdidelavar.ir;

    ssl_certificate /etc/nginx/ssl/mahdidelavar/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/mahdidelavar/private.key;

    return 301 https://mahdidelavar.ir$request_uri;
}

server {
    listen 443 ssl;
    server_name mahdidelavar.ir;

    ssl_certificate /etc/nginx/ssl/mahdidelavar/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/mahdidelavar/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://portfolio-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
