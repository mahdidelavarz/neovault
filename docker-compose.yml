name: neovault

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: neovault-backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      # اتصال به دیتابیس مرکزی
      DB_HOST: main-postgres
      DB_PORT: 5432
      DB_SYNCHRONIZE: "false"
    networks:
      - default
      - shared-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:5000
    container_name: neovault-frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:5000
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: neovault-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - default
      - web-proxy
    restart: unless-stopped

networks:
  web-proxy:
    external: true
  shared-network:
    external: true
